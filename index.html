<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validaciones Avanzadas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            padding: 0.8rem 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Actividad 1: Encuesta de Salud</h2>
    <form action="#" method="post">
        
        <!-- Edad con type="number" y min/max -->
        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" max="120" required>
        </div>

        <!-- Peso con type="number" y min/max -->
        <div class="form-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" name="peso" min="1" max="300" step="0.1" required>
        </div>

        <!-- Nivel de dolor con type="range" -->
        <div class="form-group">
            <label for="dolor">Nivel de dolor (0 a 10):</label>
            <input type="range" id="dolor" name="dolor" min="0" max="10" value="5">
        </div>

        <!-- Tipo de sangre con select -->
        <div class="form-group">
            <label for="sangre">Tipo de sangre:</label>
            <select id="sangre" name="sangre" required>
                <option value="">Selecciona...</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <hr>

        <h2>Actividad 2: Código Postal</h2>

        <!-- Código Postal con pattern para 5 números -->
        <div class="form-group">
            <label for="cp">Código Postal:</label>
            <input type="text" id="cp" name="cp" pattern="[0-9]{5}" maxlength="5" placeholder="Ej. 12345" required>
            <small>Debe contener exactamente 5 números.</small>
        </div>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
