<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Encuesta de Salud</title>
</head>
<body>

    <h2>Encuesta de Salud</h2>

    <form>

        <!-- Edad (input number con min y max) -->
        <label for="edad">Edad:</label><br>
        <input type="number" id="edad" name="edad" min="1" max="120" required><br><br>

        <!-- Peso (input number con rango) -->
        <label for="peso">Peso (kg):</label><br>
        <input type="number" id="peso" name="peso" min="1" max="300" required><br><br>

        <!-- Nivel de dolor (range) -->
        <label for="dolor">Nivel de dolor (0 a 10):</label><br>
        <input type="range" id="dolor" name="dolor" min="0" max="10" step="1"><br><br>

        <!-- Tipo de sangre (select) -->
        <label for="sangre">Tipo de sangre:</label><br>
        <select id="sangre" name="sangre" required>
            <option value="">Selecciona una opción</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select><br><br>

        <!-- Botón -->
        <button type="submit">Enviar</button>

    </form>

</body>
</html>
